<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mosh Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --body-bg: #1C1E29;
    --case: #2B2D3A;
    --case-edge: #363948;
    --screen-bg: #C7D8C2;
    --screen-fg: #1F2E1A;
    --key-num: #3F4258;
    --key-num-hover: #4A4E68;
    --key-fn: #565A78;
    --key-fn-hover: #62678A;
    --key-op: #E0A23D;
    --key-op-hover: #EAB157;
    --key-eq: #D9634B;
    --key-eq-hover: #E5745C;
    --text-light: #F1EFE9;
    --shadow: rgba(0,0,0,0.4);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --body-bg: #E4E1D8;
    }
  }
  :root[data-theme="dark"] { --body-bg: #1C1E29; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--body-bg);
    font-family: 'Inter', sans-serif;
    padding: 24px;
  }

  .calculator {
    width: 100%;
    max-width: 340px;
    background: var(--case);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 50px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
    border: 1px solid var(--case-edge);
  }

  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 2px 6px 14px;
  }

  .brand {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #8B8FA3;
  }

  .brand strong { color: var(--text-light); font-weight: 700; }

  .mode-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--key-op);
  }

  .screen {
    background: var(--screen-bg);
    border-radius: 10px;
    padding: 22px 18px 16px;
    margin-bottom: 16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  .screen-history {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--screen-fg);
    opacity: 0.55;
    min-height: 18px;
    text-align: right;
    white-space: nowrap;
    overflow-x: auto;
  }

  .screen-main {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 40px;
    color: var(--screen-fg);
    text-align: right;
    white-space: nowrap;
    overflow-x: auto;
    line-height: 1.2;
    margin-top: 4px;
  }

  .screen-main::-webkit-scrollbar, .screen-history::-webkit-scrollbar { display: none; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 16px 0;
    cursor: pointer;
    color: var(--text-light);
    background: var(--key-num);
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
  }

  button:hover { background: var(--key-num-hover); }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }

  .fn { background: var(--key-fn); }
  .fn:hover { background: var(--key-fn-hover); }

  .op { background: var(--key-op); color: #2B2200; }
  .op:hover { background: var(--key-op-hover); }

  .eq { background: var(--key-eq); grid-row: span 2; }
  .eq:hover { background: var(--key-eq-hover); }

  .zero { grid-column: span 2; }

  .keys > button:focus-visible {
    outline: 2px solid var(--text-light);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="brand-row">
    <span class="brand"><strong>CALC</strong>/01</span>
    <span class="mode-dot" aria-hidden="true"></span>
  </div>

  <div class="screen">
    <div class="screen-history" id="history">&nbsp;</div>
    <div class="screen-main" id="display">0</div>
  </div>

  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="sign">±</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-action="divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-action="multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-action="subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="eq" data-action="equals">=</button>
  </div>
</div>

<script>
(function () {
  const display = document.getElementById('display');
  const historyEl = document.getElementById('history');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  const opSymbols = { add: '+', subtract: '−', multiply: '×', divide: '÷' };

  function render() {
    display.textContent = formatForDisplay(current);
    historyEl.textContent = previous !== null && operator
      ? `${formatForDisplay(previous)} ${opSymbols[operator]}`
      : '\u00A0';
  }

  function formatForDisplay(numStr) {
    if (numStr === 'Error') return numStr;
    const n = Number(numStr);
    if (!isFinite(n)) return 'Error';
    // Keep raw string while typing (preserves trailing '.' etc.)
    if (typeof numStr === 'string' && /[.,]$/.test(numStr)) return numStr;
    const str = n.toString();
    if (str.length > 12) {
      return n.toPrecision(8).replace(/\.?0+$/, '').length > 12
        ? n.toExponential(4)
        : n.toPrecision(8).replace(/\.?0+$/, '');
    }
    return str;
  }

  function inputDigit(d) {
    if (justEvaluated) {
      current = d;
      justEvaluated = false;
      return;
    }
    if (current === '0') {
      current = d;
    } else {
      if (current.replace('-', '').replace('.', '').length >= 12) return;
      current += d;
    }
  }

  function inputDecimal() {
    if (justEvaluated) {
      current = '0.';
      justEvaluated = false;
      return;
    }
    if (!current.includes('.')) current += '.';
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
  }

  function toggleSign() {
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
  }

  function toPercent() {
    current = String(parseFloat(current) / 100);
  }

  function compute(a, b, op) {
    switch (op) {
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function chooseOperator(op) {
    if (operator && !justEvaluated) {
      evaluate();
    }
    previous = parseFloat(current);
    operator = op;
    justEvaluated = false;
    current = '0';
  }

  function evaluate() {
    if (operator === null || previous === null) return;
    const a = previous;
    const b = parseFloat(current);
    const result = compute(a, b, operator);
    current = isNaN(result) ? 'Error' : String(round(result));
    previous = null;
    operator = null;
    justEvaluated = true;
  }

  function round(n) {
    return Math.round((n + Number.EPSILON) * 1e10) / 1e10;
  }

  document.querySelectorAll('[data-num]').forEach(btn => {
    btn.addEventListener('click', () => {
      inputDigit(btn.getAttribute('data-num'));
      render();
    });
  });

  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.getAttribute('data-action');
      switch (action) {
        case 'clear': clearAll(); break;
        case 'sign': toggleSign(); break;
        case 'percent': toPercent(); break;
        case 'decimal': inputDecimal(); break;
        case 'equals': evaluate(); break;
        case 'add':
        case 'subtract':
        case 'multiply':
        case 'divide':
          chooseOperator(action);
          break;
      }
      render();
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') { inputDigit(e.key); render(); }
    else if (e.key === '.') { inputDecimal(); render(); }
    else if (e.key === '+') { chooseOperator('add'); render(); }
    else if (e.key === '-') { chooseOperator('subtract'); render(); }
    else if (e.key === '*') { chooseOperator('multiply'); render(); }
    else if (e.key === '/') { e.preventDefault(); chooseOperator('divide'); render(); }
    else if (e.key === 'Enter' || e.key === '=') { evaluate(); render(); }
    else if (e.key === 'Escape') { clearAll(); render(); }
    else if (e.key === 'Backspace') {
      if (!justEvaluated) {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        render();
      }
    }
  });

  render();
})();
</script>

</body>
</html>
