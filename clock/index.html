<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pro Digital Clock</title>
<style>body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:system-ui;background:#0f172a;color:#38bdf8}
.card{background:#1e293b;padding:30px;border-radius:20px;text-align:center;width:90%;max-width:400px}
#time{font-size:3.5rem;font-weight:800;text-shadow:0 0 15px #38bdf8}
button{margin:5px;padding:10px 16px;border-radius:20px;border:none;background:#38bdf8;color:#0f172a;font-weight:bold}
input{padding:7px;border-radius:8px;border:1px solid #334155}
#alarmList div{display:flex;justify-content:space-between;margin-top:8px;background:#0f172a;padding:8px;border-radius:8px}</style></head>
<body><div class="card">
<div id="time">00:00:00</div><div id="ampm" style="font-size:2rem;font-weight:800">AM</div>
<div id="date">Loading...</div><p style="font-size:.8rem;opacity:.6">Lagos GMT+1</p>
<div style="margin-top:20px;background:rgba(0,0,0,.2);padding:15px;border-radius:12px">
<input type="time" id="alarmTime">
<button onclick="addAlarm()">Add Alarm</button>
<button onclick="stopAlarm()">Stop</button><br>
<button onclick="testSound()">🔊 Test Sound</button>
<div id="alarmList"><h3>Saved Alarms:</h3></div>
<p id="alarmStatus"></p>
</div></div>
<script>
let alarms=JSON.parse(localStorage.getItem('alarms'))||[];
let alarmRinging=false;
let audioCtx;
let beepTimer;

function getAudio(){
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended') audioCtx.resume();
 return audioCtx;
}
function beepOnce(){
 const ctx=getAudio();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.frequency.value=880; o.type='square';
 g.gain.value=0.5;
 o.connect(g); g.connect(ctx.destination);
 o.start(); o.stop(ctx.currentTime+0.4);
}
function startBeeping(){
 if(beepTimer) return;
 beepOnce();
 beepTimer=setInterval(beepOnce,600);
 if(navigator.vibrate) navigator.vibrate([500,200,500,500,1000]);
}
function stopAlarm(){
 alarmRinging=false; clearInterval(beepTimer); beepTimer=null;
 document.getElementById('alarmStatus').textContent='Stopped';
}
function updateClock(){
 const now=new Date();
 const t=now.toLocaleTimeString('en-US',{timeZone:"Africa/Lagos",hour12:true});
 const p=t.split(' '); document.getElementById('time').textContent=p[0]; document.getElementById('ampm').textContent=p[1]||'';
 document.getElementById('date').textContent=now.toLocaleDateString('en-US',{timeZone:"Africa/Lagos",weekday:'long',year:'numeric',month:'long',day:'numeric'});
 const cur24=now.toLocaleTimeString('en-US',{timeZone:"Africa/Lagos",hour12:false,hour:'2-digit',minute:'2-digit'});
 alarms.forEach(a=>{ if(a.time24===cur24&&!alarmRinging){ alarmRinging=true; startBeeping(); document.getElementById('alarmStatus').textContent='⏰ RINGING! '+a.display; }});
}
function addAlarm(){
 getAudio(); // unlock here!
 const input=document.getElementById('alarmTime'); if(!input.value){alert('Pick time');return;}
 const [h,m]=input.value.split(':'); let hour=parseInt(h); let ampm=hour>=12?'PM':'AM'; let h12=hour%12||12;
 const display=`${String(h12).padStart(2,'0')}:${m} ${ampm}`; const time24=`${String(h).padStart(2,'0')}:${m}`;
 alarms.push({display,time24}); localStorage.setItem('alarms',JSON.stringify(alarms)); renderAlarms(); input.value='';
 document.getElementById('alarmStatus').textContent='✅ Alarm set + Sound unlocked';
}
function renderAlarms(){ const l=document.getElementById('alarmList'); l.innerHTML='<h3>Saved Alarms:</h3>'; alarms.forEach((a,i)=>{ l.innerHTML+=`<div><span>⏰ ${a.display}</span><button onclick="alarms.splice(${i},1);localStorage.setItem('alarms',JSON.stringify(alarms));renderAlarms()" style="background:#ef4444;color:white">X</button></div>`; });}
function testSound(){ getAudio(); alarmRinging=true; startBeeping(); document.getElementById('alarmStatus').textContent='🔊 BEEPING... Tap Stop to stop'; setTimeout(()=>{ if(alarms.length===0) stopAlarm(); },4000); }
setInterval(updateClock,1000); updateClock(); renderAlarms();
</script></body></html>
