<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Digital Clock - Lagos</title>
<style>
:root{--bg-dark:#0f172a;--bg-light:#f1f5f9;--text-dark:#38bdf8;--text-light:#0f172a;--card-dark:#1e293b;--card-light:#ffffff}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:system-ui;background:var(--bg-dark);color:var(--text-dark);transition:0.3s}
.card{background:var(--card-dark);padding:30px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.3);width:90%;max-width:400px}
.light body{background:var(--bg-light)}.light.card{background:var(--card-light)}
#time{font-size:3.5rem;font-weight:800;margin:10px 0;text-shadow:0 0 15px #38bdf8}
button{margin:5px;padding:8px 14px;border-radius:20px;border:none;background:#38bdf8;color:#0f172a;font-weight:bold;cursor:pointer}
input{padding:7px;border-radius:8px;border:1px solid #334155}
#alarmList div{display:flex;justify-content:space-between;margin-top:8px;background:#0f172a;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div style="position:absolute;top:15px;right:15px"><button onclick="document.documentElement.classList.toggle('light')">🌙/☀️</button></div>
<div class="card">
<div id="time">00:00:00</div>
<div id="ampm" style="font-size:2rem;font-weight:800">AM</div>
<div id="date" style="margin:10px 0;opacity:0.8">Loading...</div>
<p style="font-size:0.8rem;opacity:0.6">Lagos, Nigeria GMT+1</p>

<div style="margin-top:20px;background:rgba(0,0,0,0.2);padding:15px;border-radius:12px">
<label>Set Alarm: <input type="time" id="alarmTime"></label>
<button onclick="addAlarm()">Add Alarm</button>
<button onclick="stopAlarm()">Stop</button>
<button onclick="testSound()">🔊 Test Sound</button>
<div id="alarmList"><h3 style="margin:10px 0">Saved Alarms:</h3></div>
<p id="alarmStatus" style="color:#38bdf8;font-size:0.9rem"></p>
</div>
</div>

<script>
let audioContext;
function playLoudBeep(){
  if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.type = 'square';
  osc.frequency.value = 1000;
  gain.gain.value = 1;
  osc.connect(gain); gain.connect(audioContext.destination);
  osc.start();
  setTimeout(()=>{ osc.stop(); if(alarmRinging) playLoudBeep(); },500);
}

function testSound(){ 
  alarmRinging=true; 
  playLoudBeep(); 
  if(navigator.vibrate) navigator.vibrate([500,200,500]);
  document.getElementById('alarmStatus').textContent='🔊 BEEPING - HEAR IT?';
  setTimeout(()=>alarmRinging=false,3000);
}

function unlockAudio(){
 if(audioUnlocked) return;
  playLoudBeep().then(()=>{alarmSound.pause(); alarmSound.currentTime=0; audioUnlocked=true; document.getElementById('alarmStatus').textContent='✅ Sound unlocked!';}).catch(()=>{});
}

function updateClock(){
 const now = new Date();
 const timeStr = now.toLocaleTimeString('en-US',{timeZone:"Africa/Lagos",hour12:true});
 const parts = timeStr.split(' ');
 document.getElementById('time').textContent = parts[0];
 document.getElementById('ampm').textContent = parts[1] || '';
 document.getElementById('date').textContent = now.toLocaleDateString('en-US',{timeZone:"Africa/Lagos",weekday:'long',year:'numeric',month:'long',day:'numeric'});
 const cur24 = now.toLocaleTimeString('en-US',{timeZone:"Africa/Lagos",hour12:false,hour:'2-digit',minute:'2-digit'});
 alarms.forEach(a=>{
  if(a.time24===cur24 &&!alarmRinging){
   alarmRinging=true;
   alarmSound.play().catch(()=>{});
   if(navigator.vibrate) navigator.vibrate([500,200,500,500,1000]);
   document.getElementById('alarmStatus').textContent='⏰ RINGING! '+a.display;
  }
 });
}

function addAlarm(){
 unlockAudio();
 const input = document.getElementById('alarmTime');
 if(!input.value){ alert('Pick time first'); return; }
 const [h,m]=input.value.split(':');
 let hour=parseInt(h); let ampm= hour>=12?'PM':'AM'; let hour12= hour%12||12;
 const display = `${String(hour12).padStart(2,'0')}:${m} ${ampm}`;
 const time24 = `${String(h).padStart(2,'0')}:${m}`;
 alarms.push({display,time24});
 localStorage.setItem('alarms',JSON.stringify(alarms));
 renderAlarms();
 input.value='';
}

function renderAlarms(){
 const list=document.getElementById('alarmList');
 list.innerHTML='<h3 style="margin:10px 0">Saved Alarms:</h3>';
 alarms.forEach((a,i)=>{
  list.innerHTML+=`<div><span>⏰ ${a.display}</span><button onclick="removeAlarm(${i})" style="background:#ef4444;color:white">X</button></div>`;
 });
}
function removeAlarm(i){ alarms.splice(i,1); localStorage.setItem('alarms',JSON.stringify(alarms)); renderAlarms(); }
function stopAlarm(){ alarmSound.pause(); alarmSound.currentTime=0; alarmRinging=false; document.getElementById('alarmStatus').textContent='Stopped'; }
function testSound(){ unlockAudio(); setTimeout(()=>{ alarmSound.play().catch(()=>alert('Tap Add Alarm first to unlock sound on iPhone')); if(navigator.vibrate) navigator.vibrate([500,200,500]); },300); }

setInterval(updateClock,1000); updateClock(); renderAlarms();
</script>
</body>
</html>
